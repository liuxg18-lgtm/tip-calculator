<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tip Calculator</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: #e7efe8;
      color: #1c2822;
      font-family: "Segoe UI", "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 1.0625rem;
      line-height: 1.5;
    }

    .card {
      box-sizing: border-box;
      width: min(100%, 26rem);
      padding: 1.75rem 1.5rem 1.5rem;
      background: #fbfaf6;
      border-radius: 1.125rem;
      box-shadow: 0 18px 40px rgba(28, 48, 38, 0.14);
    }

    h1 {
      margin: 0 0 1.25rem;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .field {
      margin: 0 0 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.95rem;
      font-weight: 600;
    }

    input,
    select,
    button {
      box-sizing: border-box;
      width: 100%;
      font: inherit;
    }

    input,
    select {
      padding: 0.65rem 0.75rem;
      border: 1px solid #c5d0c8;
      border-radius: 0.65rem;
      background: #fff;
      color: inherit;
    }

    button {
      margin-top: 0.25rem;
      padding: 0.7rem 0.75rem;
      border: 0;
      border-radius: 0.65rem;
      background: #245c45;
      color: #f7fbf8;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1c4a37;
    }

    input:focus,
    select:focus,
    button:focus-visible {
      outline: 2px solid #245c45;
      outline-offset: 2px;
    }

    #result {
      margin-top: 1.25rem;
    }

    #result p {
      margin: 0.2rem 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Tip Calculator</h1>
    <!-- input for bill amount, dropdown for tip percent 10 15 20, number of people, a Calculate button, and a result area -->
    <form id="tip-form" novalidate>
      <div class="field">
        <label for="bill-amount">Bill amount</label>
        <input id="bill-amount" name="bill-amount" type="number" inputmode="decimal" min="0" step="0.01" required>
      </div>
      <div class="field">
        <label for="tip-percent">Tip percent</label>
        <select id="tip-percent" name="tip-percent">
          <option value="10">10</option>
          <option value="15" selected>15</option>
          <option value="20">20</option>
        </select>
      </div>
      <div class="field">
        <label for="people">Number of people</label>
        <input id="people" name="people" type="number" inputmode="numeric" min="1" step="1" value="1" required>
      </div>
      <button type="submit">Calculate</button>
    </form>
    <div id="result">The split will show up here.</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
